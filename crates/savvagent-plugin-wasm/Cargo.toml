[package]
name = "savvagent-plugin-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wasmtime-backed runtime for savvagent external plugins."

# Task 2 ships the SPP↔WIT conversion layer and the host-side bindgen output
# for all three worlds. Task 3 layers manifest parsing, four-path discovery,
# and the `plugin-trust.toml` ledger on top — which is where `walkdir`,
# `sha2`, `toml`, and `anyhow` come in. Adapters + capability surface land
# in Tasks 4–6 (they'll add `keyring`/`reqwest`).
#
# `wasmtime`'s default features include `component-model` and `async`,
# which are exactly what we need — no explicit feature list necessary.
[dependencies]
savvagent-plugin = { workspace = true }
savvagent-plugin-wit = { workspace = true }
savvagent-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
